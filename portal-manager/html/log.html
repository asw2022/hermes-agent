<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Proxy Log Monitor</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    :root {
      color-scheme: light dark;
      font-family: system-ui, -apple-system, Segoe UI, sans-serif;
    }
    body {
      margin: 0;
      background: #101218;
      color: #f4f6fb;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      gap: 1.5rem;
      padding: 2rem 1rem;
    }
    .card {
      width: min(1400px, 100%);
      background: #1b1f2a;
      border-radius: 12px;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.35);
      padding: 2rem;
      border: 1px solid rgba(255, 255, 255, 0.08);
    }
    .site-header {
      width: min(1400px, 100%);
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 999px;
      padding: 0.75rem 1.5rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 0.5rem 1rem;
    }
    .site-title {
      margin: 0;
      font-size: 1rem;
      font-weight: 600;
      letter-spacing: 0.03em;
    }
    .site-title span {
      color: #9ea5c6;
      font-weight: 400;
      margin-left: 0.5rem;
    }
    .site-link {
      color: #80c8ff;
      text-decoration: none;
      font-size: 0.9rem;
    }
    .site-link:hover {
      text-decoration: underline;
    }
    main header {
      display: flex;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 1rem;
      align-items: center;
    }
    h1 {
      margin: 0;
      font-size: 1.9rem;
    }
    .actions {
      display: flex;
      gap: 0.75rem;
      flex-wrap: wrap;
    }
    .pill {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 0.35rem 1rem;
      border-radius: 999px;
      border: 1px solid rgba(255, 255, 255, 0.25);
      text-decoration: none;
      color: #eaf4ff;
      background: rgba(124, 201, 255, 0.12);
      font-weight: 600;
      font-size: 0.9rem;
      cursor: pointer;
    }
    .pill:hover {
      background: rgba(124, 201, 255, 0.25);
    }
    button.pill {
      background: rgba(132, 255, 210, 0.14);
      border-color: rgba(132, 255, 210, 0.4);
    }
    button.pill:hover {
      background: rgba(132, 255, 210, 0.28);
    }
    .meta {
      color: #b4bad6;
      margin: 1rem 0 1.5rem;
    }
    .log-container {
      background: #0b0e16;
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 12px;
      padding: 1rem;
      max-height: 70vh;
      overflow-y: auto;
      font-family: "JetBrains Mono", "Fira Code", Consolas, monospace;
      font-size: 0.85rem;
      line-height: 1.4;
      white-space: pre-wrap;
    }
    .log-line {
      padding: 0.1rem 0;
      border-bottom: 1px solid rgba(255, 255, 255, 0.03);
    }
    .log-line:last-child {
      border-bottom: none;
    }
    .status-error {
      color: #ffb4b4;
    }
    .controls {
      display: flex;
      gap: 0.75rem;
      flex-wrap: wrap;
      align-items: center;
      margin-bottom: 1rem;
    }
    label {
      font-size: 0.9rem;
    }
    select {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 6px;
      color: inherit;
      padding: 0.3rem 0.6rem;
    }
  </style>
</head>
<body>
  <div class="site-header" role="banner">
    <p class="site-title">IPTV Stalker Portal Manager v2.22<span>© tem_invictus 2025</span></p>
    <a class="site-link" href="https://www.digital-eliteboard.com/threads/stalker-portal-manager.538885/" target="_blank" rel="noopener noreferrer">
      More info: https://www.digital-eliteboard.com/threads/stalker-portal-manager.538885/
    </a>
  </div>
  <main class="card">
    <header>
      <div>
        <p class="meta" style="margin:0">Live tail of iptv_proxy.log</p>
        <h1>Proxy Log Monitor</h1>
      </div>
      <div class="actions">
        <a class="pill" href="/stats/">← Back to overview</a>
        <button class="pill" id="refresh-btn">⟳ Refresh</button>
      </div>
    </header>
    <div class="controls">
      <label for="line-count">Lines:</label>
      <select id="line-count">
        <option value="100">100</option>
        <option value="200" selected>200</option>
        <option value="300">300</option>
        <option value="500">500</option>
      </select>
      <label for="poll-interval">Refresh:</label>
      <select id="poll-interval">
        <option value="1000">1 second</option>
        <option value="3000">3 seconds</option>
        <option value="5000">5 seconds</option>
        <option value="10000" selected>10 seconds</option>
      </select>
      <span id="status-message" class="meta">Fetching log…</span>
      <span id="updated-at" class="meta">Awaiting first refresh…</span>
    </div>
    <section class="log-container" id="log-container">
      <div class="log-line">Loading…</div>
    </section>
    <noscript>
      <p class="status-error">JavaScript is required to stream the proxy log.</p>
    </noscript>
  </main>
  <script>
    const statusEl = document.getElementById('status-message');
    const updatedAtEl = document.getElementById('updated-at');
    const logContainer = document.getElementById('log-container');
    const refreshBtn = document.getElementById('refresh-btn');
    const lineSelect = document.getElementById('line-count');
    const intervalSelect = document.getElementById('poll-interval');
    let autoScroll = true;
    let pollTimer = null;

    logContainer.addEventListener('scroll', () => {
      const nearBottom = logContainer.scrollHeight - logContainer.scrollTop - logContainer.clientHeight < 40;
      autoScroll = nearBottom;
    });

    function setStatus(message, isError = false) {
      statusEl.textContent = message;
      statusEl.classList.toggle('status-error', isError);
    }

    function escapeHTML(str = '') {
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;');
    }

    function renderLog(lines = []) {
      if (!Array.isArray(lines) || lines.length === 0) {
        logContainer.innerHTML = '<div class="log-line muted">(No log entries yet)</div>';
        return;
      }
      logContainer.innerHTML = lines.map((line) => `<div class="log-line">${escapeHTML(line)}</div>`).join('');
      if (autoScroll) {
        logContainer.scrollTop = logContainer.scrollHeight;
      }
    }

    async function fetchLog(isBackground = false) {
      try {
        if (!isBackground) {
          setStatus('Fetching log…');
        }
        const lines = lineSelect.value;
        const response = await fetch(`/stats/logs.json?lines=${encodeURIComponent(lines)}`, { cache: 'no-store' });
        if (!response.ok) {
          throw new Error(`Server responded with ${response.status}`);
        }
        const payload = await response.json();
        renderLog(payload?.lines);
        const stamp = new Date();
        updatedAtEl.textContent = `Updated ${stamp.toLocaleTimeString()}`;
        setStatus(`Showing last ${payload?.lines?.length ?? 0} lines`);
      } catch (error) {
        console.error('Failed to load log', error);
        setStatus('Failed to load log. Retrying shortly…', true);
      }
    }

    function reschedulePolling() {
      if (pollTimer) {
        clearInterval(pollTimer);
      }
      const interval = Number(intervalSelect.value) || 10000;
      pollTimer = setInterval(() => fetchLog(true), interval);
    }

    refreshBtn.addEventListener('click', () => fetchLog(false));
    lineSelect.addEventListener('change', () => fetchLog(false));
    intervalSelect.addEventListener('change', () => {
      reschedulePolling();
      fetchLog(true);
    });

    fetchLog(false);
    reschedulePolling();
  </script>
</body>
</html>
